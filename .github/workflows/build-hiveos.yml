name: Build FredMiner HiveOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FredMiner
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.1"
          method: "network"

      - name: Check toolchain
        run: |
          nvcc --version
          cmake --version
          g++ --version

      - name: Configure FredMiner
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Compile FredMiner
        run: |
          cmake --build build -j2

      - name: Create HiveOS package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package/fredminer

          cp build/fredminer package/fredminer/
          cp hiveos/h-manifest.conf package/fredminer/
          cp hiveos/h-config.sh package/fredminer/
          cp hiveos/h-run.sh package/fredminer/
          cp hiveos/h-stats.sh package/fredminer/

          chmod +x package/fredminer/fredminer
          chmod +x package/fredminer/h-*.sh

          echo "===== PACKAGED h-run.sh ====="
          cat package/fredminer/h-run.sh
          echo "============================="

          tar -czf fredminer-hiveos.tar.gz -C package fredminer

          echo "===== ARCHIVE CONTENTS ====="
          tar -tzf fredminer-hiveos.tar.gz
          echo "============================"

          echo "===== h-run.sh FROM ARCHIVE ====="
          tar -xOzf fredminer-hiveos.tar.gz fredminer/h-run.sh
          echo "================================="

          sha256sum fredminer-hiveos.tar.gz

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fredminer-hiveos
          path: fredminer-hiveos.tar.gz
          if-no-files-found: error

      - name: Attach package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" fredminer-hiveos.tar.gz --clobber
          else
            gh release create "$TAG" fredminer-hiveos.tar.gz \
              --title "FredMiner $TAG" \
              --prerelease \
              --notes "Automated HiveOS development build."
          fi
